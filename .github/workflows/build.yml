name: Build Windows VST3 and Standalone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release -j

      - name: Upload Plugin Files
        uses: actions/upload-artifact@v4
        with:
          name: NoiseMu6ixSampler-VST3-and-Standalone
          path: build/NoiseMu6ixSampler_artefacts/Release/
